name: Deploy viewer to GitHub Pages

# Publishes viewer/ (the static CesiumJS viewer app) as-is to GitHub Pages.
# This deploys the app only — no 3D Tiles data. Tile output is derived and
# regenerable (see data/output/ in .gitignore) and is not committed to this
# repo, so the hosted viewer has nothing to show via its dataset dropdown
# unless the visitor also points it at a tileset they're hosting elsewhere
# (the "Custom tileset URL" field) or serves tiles at this same origin's
# /tiles/ path themselves.

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload viewer/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
