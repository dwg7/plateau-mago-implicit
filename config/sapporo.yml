# Source statistics — real output of `make inspect DATASET=sapporo`
# (tools/inspect_citygml.py), run 2026-08-28 against the fully-extracted
# archive (2816 .gml/.xml files, including non-building layers — same
# whole-archive scan as Sarabetsu/Muroran). Report:
# manifests/reports/inspect-sapporo.json
source_stats:
  citygml_file_count: 2816
  building_count: 646474
  gml_id_count: 2079121
  # LOD4 appearing here is real, not a parsing artifact — some Sapporo
  # source buildings carry an lod4 tag (unusual for a building feature;
  # LOD4 is normally an indoor/interior CityGML concept). Irrelevant to
  # the LOD1 baseline either way: tools/strip_higher_lod.py strips
  # everything except LOD1 regardless of which higher LODs are present.
  lods_present: [1, 2, 4]
  polygon_count: 67363086
  texture_references: 3649
  crs: "http://www.opengis.net/def/crs/EPSG/0/6697"
  bbox_min_lat: 42.78124988164719
  bbox_max_lat: 43.191666999995306
  bbox_min_lon: 140.99111949640857
  bbox_max_lon: 141.51249999967547

# CRS observations — already verified empirically in Phase 7b
# (docs/findings.md), by inspecting real gml:pos/srsName values in a
# genuine Sapporo building extract and by running mago-3d-tiler 1.16.2
# against it successfully with this exact proj string.
crs:
  srs_name: "http://www.opengis.net/def/crs/EPSG/0/6697"
  # EPSG:6697 = JGD2011 (3D geographic). Observed axis order in gml:pos is
  # (latitude, longitude, height) — identical to Sarabetsu/Muroran. Verified
  # directly against Sapporo's own source in Phase 7b (srsName
  # "http://www.opengis.net/def/crs/EPSG/0/6697", posList sample
  # "43.0815... 141.2923... <height>" — 43°N/141°E is Sapporo's real extent).
  axis_order: "lat, lon, height (northing-first)"
  epoch: "JGD2011 (no explicit epoch in the CityGML; JGD2011 is a static/plate-fixed datum, not epoch-dependent like ITRF)"
  mago_proj: "+proj=longlat +datum=WGS84 +axis=neu +no_defs"
  notes: >
    Same CRS/axis-order handling as Sarabetsu/Muroran — PLATEAU
    standardizes this nationally, and Phase 7b confirmed it empirically
    for Sapporo rather than assuming it carried over. See
    docs/findings.md's Phase 7b section.

# Predefined camera positions for CesiumJS viewer.
# `default` is a provisional bbox-center value — viewer/viewer.js's own
# VIEWPOINTS entries use the real full build's own tileset.json bounding
# region instead (same convention as Sarabetsu/Muroran, see viewer.js's
# comment block), computed once that build exists.
camera_positions:
  default:
    name: "Sapporo City overview"
    # Center of the real full-profile Explicit build's root tileset.json
    # bounding region (fit to actual building extent, ~31km x 32km),
    # computed 2026-08-28 after the full build completed.
    longitude: 141.312568
    latitude: 43.040184
    height: 15000
    heading: 0
    pitch: -45
    roll: 0
  small_area:
    name: "Small test area (small_file building)"
    # Midpoint of udx/bldg/64413140_bldg_6697_op.gml's envelope
    # (42.95619097530532,141.13025856493985,0) to
    # (42.95626139572342,141.13035226066484,571.525)
    longitude: 141.1303054
    latitude: 42.9562262
    height: 1000
    heading: 0
    pitch: -45
    roll: 0
