# Source statistics — real output of `make inspect DATASET=sarabetsu`
# (tools/inspect_citygml.py), run 2026-08-25 against the fully-extracted
# archive (1139 .gml/.xml files, 1123 with a parsed bbox). Report:
# manifests/reports/inspect-sarabetsu.json
source_stats:
  citygml_file_count: 1139
  building_count: 6795
  gml_id_count: 1324582
  lods_present: [1, 2, 3]
  polygon_count: 7643758
  texture_references: 0
  crs: "http://www.opengis.net/def/crs/EPSG/0/6697"
  bbox_min_lat: 42.5349167
  bbox_max_lat: 42.7659167
  bbox_min_lon: 142.99825
  bbox_max_lon: 143.3590417

# CRS observations — real, from inspection. Every one of the 1139 source
# files uses this same CRS (single srs_name across the whole dataset).
crs:
  srs_name: "http://www.opengis.net/def/crs/EPSG/0/6697"
  # EPSG:6697 = JGD2011 (3D geographic). Observed axis order in gml:pos /
  # lowerCorner / upperCorner is (latitude, longitude, height) — e.g. the
  # small_file's envelope is "42.660... 143.253... 0" to "42.660...
  # 143.253... 154.376", where the first number is clearly latitude
  # (Hokkaido is ~42-43°N) and the second longitude. This is northing-first,
  # NOT the (lon, lat, height) order 3D Tiles/CesiumJS use internally —
  # Mago 3DTiler's --crs/--proj handling must account for this.
  axis_order: "lat, lon, height (northing-first)"
  epoch: "JGD2011 (no explicit epoch in the CityGML; JGD2011 is a static/plate-fixed datum, not epoch-dependent like ITRF)"
  # Verified 2026-08-25 by actually running mago-3d-tiler 1.16.2 against
  # udx/bldg/63437290_bldg_6697_op.gml (the small_file). Passing --crs
  # 6697, 6668, or 4326 all silently produced WRONG output coordinates
  # (building placed at ~137°W, 37°N — off the California coast — instead
  # of ~143°E, 43°N). This explicit Proj4 string with +axis=neu (north-
  # east-up) fixed it: output matched the source envelope exactly. Used by
  # scripts/build.sh via --proj (which takes precedence over --crs).
  mago_proj: "+proj=longlat +datum=WGS84 +axis=neu +no_defs"
  notes: >
    docs/architecture.md's original assumption that PLATEAU CityGML uses
    the Plane Rectangular CS (平面直角座標系) does not hold for this
    dataset (2023 V4 release) — it uses geographic EPSG:6697 instead. See
    docs/findings.md Phase 0 entry.

# Predefined camera positions for CesiumJS viewer
camera_positions:
  default:
    name: "Sarabetsu Village overview"
    longitude: 143.1
    latitude: 42.6
    height: 5000
    heading: 0
    pitch: -45
    roll: 0
  small_area:
    name: "Small test area (small_file building)"
    # Midpoint of udx/bldg/63437290_bldg_6697_op.gml's envelope
    # (42.66038427179971,143.25301635883892,0) to
    # (42.66041942501154,143.2530700433536,154.376)
    longitude: 143.2530432
    latitude: 42.6604018
    height: 1000
    heading: 0
    pitch: -45
    roll: 0
