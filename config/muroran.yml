# Source statistics — real output of `make inspect DATASET=muroran`
# (tools/inspect_citygml.py), run 2026-08-25 against the fully-extracted
# archive (284 .gml/.xml files, 251 with a parsed bbox). Building count
# (55906) matches the archive's own README.md exactly ("LOD1: 5.97km2
# 55906棟"). Report: manifests/reports/inspect-muroran.json
source_stats:
  citygml_file_count: 284
  building_count: 55906
  gml_id_count: 114376
  lods_present: [1]
  polygon_count: 1192276
  texture_references: 0
  crs: "http://www.opengis.net/def/crs/EPSG/0/6697"
  bbox_min_lat: 42.29705884131977
  bbox_max_lat: 42.43779545373584
  bbox_min_lon: 140.89958815430626
  bbox_max_lon: 141.06542030178898

# CRS observations — real, from inspection. Same CRS as Sarabetsu
# (EPSG:6697, JGD2011 3D geographic) across every one of the 284 source files.
crs:
  srs_name: "http://www.opengis.net/def/crs/EPSG/0/6697"
  axis_order: "lat, lon, height (northing-first) — same convention as Sarabetsu"
  epoch: "JGD2011 (static datum, no explicit epoch in the CityGML)"
  # Verified 2026-08-25 against udx/bldg/63403767_bldg_6697_op.gml (the
  # small_file): output matched the source envelope exactly
  # (140.9694°E/42.3076°N). Same fix as Sarabetsu — see its crs.mago_proj
  # comment for why --crs 6697/6668/4326 alone silently misplaces buildings.
  mago_proj: "+proj=longlat +datum=WGS84 +axis=neu +no_defs"
  notes: "Muroran has coastal and sloped terrain. Verify ellipsoidal height handling in Phase 5."

# Predefined camera positions for CesiumJS viewer
camera_positions:
  default:
    name: "Muroran City overview"
    longitude: 141.0
    latitude: 42.3
    height: 8000
    heading: 0
    pitch: -45
    roll: 0
  small_area:
    name: "Small test area (small_file building)"
    # Midpoint of udx/bldg/63403767_bldg_6697_op.gml's envelope
    longitude: 140.9694881
    latitude: 42.3075806
    height: 1000
    heading: 0
    pitch: -45
    roll: 0
