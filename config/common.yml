# Common configuration for plateau-mago-implicit experiment
# All tool versions are pinned. Resolve TBD_VERIFIED_SOURCE_REQUIRED values
# before running experiments.

schema_version: "1"

mago:
  # Mago 3DTiler version and immutable reference.
  # As of 2026-08-24, Gaia3D does not publish a public pre-built Docker
  # image for mago-3d-tiler (checked ghcr.io/gaia3d/mago-3d-tiler: no
  # image found). Pinning is therefore done via jar_url + jar_sha256:
  # scripts/build.sh builds a local image from these via Dockerfile
  # (which downloads and sha256-verifies the JAR at build time).
  version: "1.16.2"
  jar_url: "https://github.com/Gaia3D/mago-3d-tiler/releases/download/v1.16.2/mago-3d-tiler-1.16.2.jar"
  jar_sha256: "d37e58b634e91d7ce7ca046168b1db2cf950cd9b2ffacb826fd3b10a8d31f7e2"

java:
  # Java version required by Mago
  version: "21"
  image: "eclipse-temurin:21-jre-jammy"

validators:
  # 3D Tiles validator (npm package "3d-tiles-validator"). Recorded here
  # for provenance, but NOT currently enforced: scripts/validate.sh does
  # not read this field and just runs whatever `npx 3d-tiles-validator`
  # resolves to at invocation time. 0.6.1 is what npx actually installed
  # when scripts/validate.sh was run for real on 2026-08-25 — pin
  # scripts/validate.sh to this value as a follow-up (tracked in
  # HANDOVER.md) rather than trusting npx's floating resolution.
  tiles_validator_version: "0.6.1"
  # glTF validator — not yet run independently; 3d-tiles-validator's own
  # content validation covers GLB but is a different tool from the
  # standalone gltf-validator package.
  gltf_validator_version: "TBD_VERIFIED_SOURCE_REQUIRED"

tiling:
  # Implicit Tiling subtree levels
  # Depth of each subtree. Mago default may differ; record actual value used.
  subtree_levels: 3
  # Maximum number of LODs to include
  max_lod: 1
  # Geometric error at the root (metres). Adjust after inspection.
  root_geometric_error: 100.0
  # Refinement: ADD or REPLACE
  refinement: "ADD"

conversion:
  # Triangle count target per tile (adjust based on experiment)
  max_triangles_per_tile: 65536
  # Concurrency (number of threads)
  concurrency: 1
  # Memory limit for JVM
  java_opts: "-Xmx4g"

output:
  # Output format
  format: "3dtiles"
  # 3D Tiles version
  tiles_version: "1.1"
  # CRS for output (ECEF/WGS84 assumed by 3D Tiles)
  output_crs: "EPSG:4978"
