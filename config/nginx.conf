server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # CORS for 3D Tiles
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;

    # Byte ranges for large tile content
    add_header Accept-Ranges bytes always;

    # Cache-Control
    location ~* \.json$ {
        add_header Content-Type "application/json" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # .subtree is the 3D Tiles 1.1 implicit-tiling binary format (4-byte
    # "subt" magic + binary header + length-prefixed JSON/binary chunks),
    # not JSON — see tools/inspect_subtree.py's decoder.
    location ~* \.subtree$ {
        add_header Content-Type "application/octet-stream" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.glb$ {
        add_header Content-Type "model/gltf-binary" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.gltf$ {
        add_header Content-Type "model/gltf+json" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /tiles/ {
        alias /usr/share/nginx/html/tiles/;
        autoindex on;
    }

    location /viewer/ {
        alias /usr/share/nginx/html/viewer/;
    }
}
